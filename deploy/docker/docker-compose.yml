services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock-acp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mock-acp
    ports:
      - "3000:3000"
    command: ["--port", "3000", "--verbose"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w1 localhost 3000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      nats:
        condition: service_healthy

  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.proxy
    environment:
      ACP_ADDR: mock-acp:3000
      NATS_URL: nats://nats:4222
      NATS_STREAM: AGENT_TASKS
      NATS_SUBJECT: "agent.tasks.>"
      WORK_DIR: /workspace
      LOG_LEVEL: debug
    depends_on:
      nats:
        condition: service_healthy
      mock-acp:
        condition: service_healthy
    restart: on-failure
