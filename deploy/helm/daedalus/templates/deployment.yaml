{{- range .Values.workers }}
{{- if and .enabled (not ($.Values.keda.enabled)) }}
{{- $worker := . }}
{{- $root := $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daedalus.workerFullname" (dict "root" $root "worker" $worker) }}
  labels:
    {{- include "daedalus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $worker.name }}
spec:
  replicas: {{ $worker.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "daedalus.workerSelectorLabels" (dict "root" $root "worker" $worker) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "daedalus.workerSelectorLabels" (dict "root" $root "worker" $worker) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds | default 35 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: agent-registry
          configMap:
            name: {{ include "daedalus.fullname" $root }}-registry

      containers:
        # Proxy sidecar: consumes from NATS JetStream and drives the agent via ACP
        - name: proxy
          {{- $proxyImage := $root.Values.proxy.image }}
          {{- if and $worker.proxy $worker.proxy.image }}
          {{- $proxyImage = $worker.proxy.image }}
          {{- end }}
          image: "{{ $proxyImage.repository }}:{{ $proxyImage.tag | default "latest" }}"
          imagePullPolicy: {{ $proxyImage.pullPolicy | default "IfNotPresent" }}
          env:
            - name: ACP_ADDR
              value: "localhost:{{ $worker.acpPort | default 3000 }}"
            - name: NATS_URL
              value: {{ include "daedalus.natsURL" $root | quote }}
            - name: NATS_STREAM
              value: {{ $root.Values.keda.natsStream | default "AGENT_TASKS" | quote }}
            - name: NATS_SUBJECT
              value: {{ $worker.queueSubject | quote }}
            - name: WORK_DIR
              value: "/workspace"
            - name: LOG_LEVEL
              value: {{ $root.Values.global.logLevel | default "info" | quote }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: agent-registry
              mountPath: /etc/daedalus
              readOnly: true
          {{- with $worker.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              # 'true' is available on all base images; the proxy entrypoint crashing restarts the
              # container automatically - this probe catches hangs.
              # TODO: replace with httpGet once proxy exposes a /healthz endpoint.
              command: ["true"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

        # Agent container: the AI agent runtime that listens on ACP
        - name: agent
          image: "{{ $worker.image.repository }}:{{ $worker.image.tag | default "latest" }}"
          imagePullPolicy: {{ $worker.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: acp
              containerPort: {{ $worker.acpPort | default 3000 }}
              protocol: TCP
          {{- with $worker.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          {{- with $worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: acp
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: acp
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
{{- end }}
{{- end }}
