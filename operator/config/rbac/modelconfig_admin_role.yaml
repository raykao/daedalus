# This rule is not used by the project agent-forge-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over forge.agentforge.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent-forge-operator
    app.kubernetes.io/managed-by: kustomize
  name: modelconfig-admin-role
rules:
- apiGroups:
  - forge.agentforge.dev
  resources:
  - modelconfigs
  verbs:
  - '*'
- apiGroups:
  - forge.agentforge.dev
  resources:
  - modelconfigs/status
  verbs:
  - get
