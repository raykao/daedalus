# This rule is not used by the project daedalus-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the daedalus.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: daedalus-operator
    app.kubernetes.io/managed-by: kustomize
  name: agentruntime-editor-role
rules:
- apiGroups:
  - daedalus.dev
  resources:
  - agentruntimes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - daedalus.dev
  resources:
  - agentruntimes/status
  verbs:
  - get
