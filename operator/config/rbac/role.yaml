---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - daedalus.dev
  resources:
  - agentcards
  - agentruntimes
  - mcpservers
  - modelconfigs
  - taskpipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - daedalus.dev
  resources:
  - agentcards/finalizers
  - agentruntimes/finalizers
  - mcpservers/finalizers
  - modelconfigs/finalizers
  - taskpipelines/finalizers
  verbs:
  - update
- apiGroups:
  - daedalus.dev
  resources:
  - agentcards/status
  - agentruntimes/status
  - mcpservers/status
  - modelconfigs/status
  - taskpipelines/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - keda.sh
  resources:
  - scaledjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
