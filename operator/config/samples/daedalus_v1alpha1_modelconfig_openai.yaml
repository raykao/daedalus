apiVersion: daedalus.dev/v1alpha1
kind: ModelConfig
metadata:
  name: openai-gpt4o
  namespace: daedalus
spec:
  provider: openai
  model: gpt-4o
  apiEndpoint: https://api.openai.com/v1
  apiKey:
    valueFrom:
      secretKeyRef:
        name: openai-credentials
        key: api-key
  parameters:
    temperature: "0.7"
    max_tokens: "4096"
