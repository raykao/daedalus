apiVersion: forge.agentforge.dev/v1alpha1
kind: AgentCard
metadata:
  name: shared-copilot-card
  namespace: agent-forge
spec:
  agentName: copilot
  description: "Shared AgentCard for all copilot-bridge workers"
  version: "1.0.0"
  skills:
  - id: code-review
    name: Code Review
    description: "Review code for bugs, style, and best practices"
    tags: ["review", "quality"]
  - id: code-generation
    name: Code Generation
    description: "Generate code from natural language specifications"
    tags: ["generation", "coding"]
  defaultInputModes: ["text/plain"]
  defaultOutputModes: ["text/plain"]
  capabilities:
    streaming: false
    pushNotifications: false
